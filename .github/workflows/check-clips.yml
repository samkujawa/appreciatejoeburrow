name: Check clips

# YouTube videos get taken down or have embedding switched off without warning.
# This runs weekly and whenever the clip list changes, and fails if any clip is unplayable.
on:
  schedule:
    - cron: '17 14 * * 1'
  workflow_dispatch:
  pull_request:
    paths: ['src/data/clips.ts', 'src/data/posts.ts']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:clips
